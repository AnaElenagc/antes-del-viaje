<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2348b8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Antes del Viaje">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Antes del Viaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one mobile column (max 640px) — eclectic "poster" header, framed budget card, alerts, task list with a color per category, sheet for editing. */
:root {
  --bg: #fde6da;            /* peach wall */
  --surface: #fffaf4;
  --ink: #1c2142;
  --muted: #6b5d63;
  --line: #ecd3c6;
  --accent: #e0442a;        /* tomato */
  --accent-soft: #fde0d8;
  --cobalt: #2348b8; --tomato: #e0442a; --emerald: #18864a; --mustard: #f2b129; --pink: #e9609a; --violet: #7b4bc4; --sun: #f4ef4a;
  --tomato-ink: #c2341c; --pink-ink: #c23a77; --mustard-ink: #9a6400;
  --on-poster: #fff8ef;
  --ok: #1d7a4f; --ok-soft: #dff2e6;
  --warn: #9a5b00; --warn-soft: #fdefcf;
  --bad: #b3261e; --bad-soft: #fde0dc;
  --shadow: 0 1px 2px rgba(60,30,20,.06), 0 4px 16px rgba(60,30,20,.07);
  --fun: "Shrikhand", "Bricolage Grotesque", Georgia, serif;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a33; --surface: #1f2547; --ink: #fbefe6; --muted: #b6abba; --line: #343c66;
  --accent: #ff7a5c; --accent-soft: #40231f;
  --cobalt: #3a63d8; --tomato: #ff7a5c; --emerald: #4cc785; --mustard: #f7c14a; --pink: #ff8ab8; --violet: #a585f0;
  --tomato-ink: #ff7a5c; --pink-ink: #ff8ab8; --mustard-ink: #f7c14a;
  --ok: #5cc795; --ok-soft: #173326; --warn: #f0b45a; --warn-soft: #3a2c14; --bad: #ff8a80; --bad-soft: #3d1b19;
  --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151a33; --surface: #1f2547; --ink: #fbefe6; --muted: #b6abba; --line: #343c66;
  --accent: #ff7a5c; --accent-soft: #40231f;
  --cobalt: #3a63d8; --tomato: #ff7a5c; --emerald: #4cc785; --mustard: #f7c14a; --pink: #ff8ab8; --violet: #a585f0;
  --tomato-ink: #ff7a5c; --pink-ink: #ff8ab8; --mustard-ink: #f7c14a;
  --ok: #5cc795; --ok-soft: #173326; --warn: #f0b45a; --warn-soft: #3a2c14; --bad: #ff8a80; --bad-soft: #3d1b19;
  --shadow: none; color-scheme: dark }
.c-tramite { --c: var(--cobalt); --ci: var(--cobalt) }
.c-compra { --c: var(--tomato); --ci: var(--tomato-ink) }
.c-reserva { --c: var(--emerald); --ci: var(--emerald) }
.c-llamada { --c: var(--pink); --ci: var(--pink-ink) }
.c-dinero { --c: var(--mustard); --ci: var(--mustard-ink) }
.c-otro { --c: var(--violet); --ci: var(--violet) }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 110px }
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 14px }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.num { font-variant-numeric: tabular-nums }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }

/* Header */
.top { display: flex; gap: 8px; align-items: center }
.top select { flex: 1; min-width: 0; background: transparent; border: 0; font-weight: 600; color: var(--muted); padding: 4px 0 }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; font-size: 13px }
.hero { position: relative; overflow: hidden; isolation: isolate; border-radius: 22px; padding: 22px 18px; background: var(--cobalt); color: var(--on-poster);
  display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .9;
  background:
    radial-gradient(circle at 100% 0%, var(--tomato) 0 46px, transparent 47px),
    radial-gradient(circle at 0% 100%, var(--emerald) 0 38px, transparent 39px),
    radial-gradient(circle at 72% 112%, var(--pink) 0 30px, transparent 31px),
    radial-gradient(circle at 8% 10%, var(--mustard) 0 7px, transparent 8px),
    radial-gradient(circle at 16% 22%, var(--sun) 0 4px, transparent 5px) }
.hero h1 { font-family: var(--fun); font-weight: 400; color: var(--sun); font-size: clamp(30px, 8vw, 44px); line-height: 1.1; text-shadow: 3px 3px 0 var(--tomato); overflow-wrap: anywhere; min-width: 0 }
.hero .sub { grid-column: 1; font-weight: 500; opacity: .92 }
.count { grid-row: 1 / span 2; grid-column: 2; width: 96px; height: 96px; border-radius: 50%; background: var(--mustard); color: #1c2142;
  display: grid; place-content: center; text-align: center; transform: rotate(-8deg); box-shadow: 4px 4px 0 var(--tomato) }
.count b { display: block; font-family: var(--display); font-size: 40px; line-height: .9; font-weight: 800 }
.count span { font-size: 11px; font-weight: 600; max-width: 80px }
.progress { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden }
.progress i { display: block; height: 100%; width: 0; transition: width .3s;
  background: linear-gradient(90deg, var(--cobalt) 0 25%, var(--tomato) 25% 50%, var(--mustard) 50% 75%, var(--emerald) 75%) }
.progtxt { font-size: 13px; color: var(--muted); margin-top: 6px }

/* Budget */
.card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 16px }
.budget { border: 3px solid var(--mustard); box-shadow: 6px 6px 0 var(--emerald); margin-right: 6px }
.budget h2 { font-family: var(--fun); font-weight: 400; font-size: 22px; margin-bottom: 12px; color: var(--cobalt) }
.btable { display: grid; grid-template-columns: 1fr auto auto; gap: 8px 16px; align-items: center }
.btable .h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: right; font-weight: 600 }
.btable .r { text-align: right }
.btable .row-l { color: var(--muted) }
.btable input { width: 100px; text-align: right; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 8px }
.btable .falta { font-weight: 700; font-size: 17px }
.btable .sep { grid-column: 1 / -1; height: 1px; background: var(--line) }
.falta.bad { color: var(--bad) } .falta.good { color: var(--ok) }
.combined { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center }
.combined input { width: 64px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 3px 6px; text-align: right }
.combined strong { color: var(--ink) }

/* Alerts */
.alerts { display: grid; gap: 8px }
.alert { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; font-size: 14px; border: 0; text-align: left; width: 100% }
.alert.bad { background: var(--bad-soft); color: var(--bad) }
.alert.warn { background: var(--warn-soft); color: var(--warn) }
.alert b { font-weight: 700 }

/* Filters */
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; white-space: nowrap }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.chip[class*="c-"]::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px }
.chip[class*="c-"][aria-pressed="true"] { background: color-mix(in srgb, var(--c) 24%, var(--surface)); color: var(--ink); border-color: var(--c) }

/* Tasks */
.list { display: grid; gap: 8px }
.task { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; border-left: 6px solid var(--c, var(--line)) }
.task.done { opacity: .6 } .task.done .ttl { text-decoration: line-through }
.check { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--muted); background: transparent; display: grid; place-items: center; margin-top: 1px; padding: 0 }
.task.done .check { background: var(--ok); border-color: var(--ok); color: #fff }
.body { min-width: 0; text-align: left; background: none; border: 0; padding: 0 }
.ttl { font-weight: 600; overflow-wrap: anywhere }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--muted); margin-top: 3px }
.cat { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ci, var(--accent)) }
.amt { text-align: right; font-weight: 600; font-size: 14px; white-space: nowrap }
.pill { grid-column: 2 / -1; justify-self: start; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px }
.pill.bad { background: var(--bad-soft); color: var(--bad) } .pill.warn { background: var(--warn-soft); color: var(--warn) } .pill.ok { background: var(--ok-soft); color: var(--ok) }
.gcal { grid-column: 2 / -1; font-size: 12.5px; color: var(--accent); text-decoration: none; font-weight: 500 }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1px dashed var(--line); border-radius: 14px }
.notice { padding: 12px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 14px }

.fab { position: fixed; right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); background: var(--accent); color: #fff; border: 0; border-radius: 99px; padding: 14px 22px; font-weight: 600; box-shadow: 4px 4px 0 var(--cobalt); font-size: 15px }
:root[data-theme="dark"] .fab { color: #1a0a0e }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fab { color: #1a0a0e } }
.tools { display: flex; gap: 8px; flex-wrap: wrap }
.tools .iconbtn { flex: 1; min-width: 140px; padding: 10px }

/* Sheet */
.overlay { position: fixed; inset: 0; background: rgba(10,15,25,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20 }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-height: 92vh; overflow-y: auto; display: grid; gap: 12px }
@media (min-width: 600px) { .overlay { align-items: center } .sheet { border-radius: 20px } }
.sheet h2 { font-family: var(--fun); font-weight: 400; font-size: 24px; color: var(--cobalt) }
.field { display: grid; gap: 4px }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px; width: 100%; min-width: 0 }
.field small { color: var(--muted); font-size: 12px }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.two > * { min-width: 0 }
.cats { display: flex; flex-wrap: wrap; gap: 6px }
.actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; margin-top: 4px }
.btn { border: 0; border-radius: 10px; padding: 11px 18px; font-weight: 600 }
.btn.primary { background: var(--accent); color: #fff }
:root[data-theme="dark"] .btn.primary { color: #1a0a0e }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #1a0a0e } }
.btn.ghost { background: transparent; border: 1px solid var(--line) }
.btn.danger { background: transparent; color: var(--bad) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
html { color-scheme: light } body { margin: 0 }
[hidden] { display: none !important }
.login { max-width: 420px; margin: 8vh auto 0; display: grid; gap: 16px }
.login .hero { grid-template-columns: 1fr }
.login form { display: grid; gap: 12px }
.login p { margin: 0; color: var(--muted) }
.login .ok { color: var(--ok); font-weight: 600 }
</style>
</head>
<body>



<div class="login" id="login" hidden>
  <section class="hero"><h1>Antes del Viaje</h1><div class="sub">Tus pendientes, fechas límite y presupuesto, en el celular y la laptop.</div></section>
  <form class="card" id="loginForm">
    <label class="field"><span class="label">Tu correo</span><input id="email" type="email" autocomplete="email" required placeholder="tucorreo@gmail.com"></label>
    <button class="btn primary" type="submit" id="loginBtn">Enviarme el enlace para entrar</button>
    <p id="loginMsg">Te llega un correo con un enlace. Lo abres y listo, sin contraseña.</p>
  </form>
</div>
<div class="wrap" id="app" hidden>
  <div class="top">
    <select id="planSel" aria-label="Actividad"></select>
    <button class="iconbtn" id="newPlanBtn" type="button">+ Actividad</button>
    <button class="iconbtn" id="editPlanBtn" type="button">Editar</button>
    <button class="iconbtn" id="logoutBtn" type="button">Salir</button>
  </div>

  <section class="hero">
    <h1 id="planName">Cargando…</h1>
    <div class="sub" id="planDate"></div>
    <div class="count"><b class="num" id="days">–</b><span id="daysLbl">días</span></div>
  </section>
  <div>
    <div class="progress"><i id="prog"></i></div>
    <div class="progtxt" id="progTxt"></div>
  </div>

  <div id="notice" class="notice" hidden></div>
  <div class="alerts" id="alerts"></div>

  <section class="card budget">
    <h2>Presupuesto</h2>
    <div class="btable num">
      <span></span><span class="h">Soles</span><span class="h">Dólares</span>
      <span class="row-l">Necesitas (pendiente)</span><span class="r" id="needPEN">–</span><span class="r" id="needUSD">–</span>
      <span class="row-l">Ya pagado</span><span class="r" id="paidPEN">–</span><span class="r" id="paidUSD">–</span>
      <span class="row-l">Tienes ahorrado</span>
      <span class="r"><input id="savedPEN" inputmode="decimal" aria-label="Ahorrado en soles" placeholder="0"></span>
      <span class="r"><input id="savedUSD" inputmode="decimal" aria-label="Ahorrado en dólares" placeholder="0"></span>
      <span class="sep"></span>
      <span class="row-l"><b>Te falta</b></span><span class="r falta" id="gapPEN">–</span><span class="r falta" id="gapUSD">–</span>
    </div>
    <div class="combined">
      <span>Tipo de cambio: S/ <input id="rate" inputmode="decimal" aria-label="Soles por dólar"> por US$1</span>
      <span id="combined"></span>
    </div>
  </section>

  <div class="filters" id="filters"></div>
  <div class="list" id="list"></div>

  <div class="tools">
    <button class="iconbtn" id="icsBtn" type="button">Descargar todo para el calendario (.ics)</button>
  </div>
</div>

<button class="fab" id="addBtn" type="button" hidden>+ Agregar tarea</button>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script src="/supabase.js"></script>
<script src="/app.js"></script>
</body>
</html>
